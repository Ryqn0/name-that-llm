[project]
name = "name-that-llm"
version = "0.1.0"
description = "End-to-end MLOps project for the Kaggle Name That LLM competition"
readme = "README.md"
license = "MIT"
authors = [{ name = "Ryqn0" }]
requires-python = ">=3.11"
# Lower bounds are deliberately LOOSE. The offline Kaggle submission notebook can't
# upgrade the packages preinstalled in Kaggle's image, so a too-recent floor (e.g.
# pandas>=3) would make `pip install --no-index` fail at scoring time.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1.1",          # pandera's own minimum
    "pandera[pandas]>=0.24",  # >=0.24 provides the `pandera.pandas` import namespace
    "pyarrow>=14",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",      # >=1.3 for recall_score(zero_division=np.nan)
]

[project.optional-dependencies]
# Experiment tracking stays optional: the offline submission notebook must never
# need it (Review Focus 5).
track = [
    "wandb>=0.19",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"  # Kaggle runs 3.11-era Python: flag syntax newer than that

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes basics; I: import order; UP: modern syntax;
# B: likely bugs (bugbear); SIM: needless complexity.
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
