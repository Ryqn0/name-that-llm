# The LLM classifier (P7, llm.py): Qwen 3 8B base, with LoRA on its 4-bit weights.
# The notebooks override base_model with the mounted Kaggle Models folder
# (lm.find_model_dir("8b-base")). n_layers, pool_size and the step size come from
# notebook 11's exploration; until then, the usual QLoRA starting points.
name: llm
base_model: Qwen/Qwen3-8B-Base
n_layers: null
load_in_4bit: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
max_length: 512
batch_size: 8
lr: 0.0001
epochs: 2
warmup_ratio: 0.05
weight_decay: 0.0
pool_size: 0
n_splits: 5
seed: 42
