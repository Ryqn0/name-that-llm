# P8's five-member ensemble (Task 5): P7's four members plus DeBERTa-v3-large, trained once
# on the whole clean pool and never on one of our passages (notebook 13, two seeds).
# PREVIEW: these weights come from the gate on version 2's predictions, which still held a
# dropped source. Version 3's gate replaces them before this ships.
name: ensemble_p8
