# Continuous Integration: every change gets the same checks, on a clean Linux machine.
# "Works on my machine" doesn't count. This is the gate a pull request must pass
# before it's merged (see the Ship procedure in Context.md).
name: ci

on:
  push:
    branches: [main]   # direct pushes to main (and merges into it)
  pull_request:        # every PR. Feature-branch pushes are covered by their PR, which
                       # avoids running everything twice per commit.

# Least privilege: CI only needs to read the code. If a dependency were ever
# compromised, it couldn't use the job's token to modify the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Python 3.11 is our MINIMUM supported version (requires-python >= 3.11), tested here
      # with the newest locked dependencies. Kaggle's real runtime is tested by the
      # kaggle-env job below.
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      # --locked: fail if uv.lock doesn't match pyproject.toml, so CI never silently
      # resolves different versions than the ones we tested locally.
      # --all-extras: install the optional `track` extra (wandb), so the tracking
      # test runs instead of being skipped.
      - run: uv sync --locked --all-extras

      - run: uv run ruff check .            # lint: likely bugs, style, import order
      - run: uv run ruff format --check .   # formatting: fail instead of rewriting
      - run: uv run pytest -q               # the tests (fake data only, never real data)

  # Production parity: the exact runtime of Kaggle notebooks, as recorded by the EDA run
  # (2026-10-24). Kaggle has OLDER libraries than our lockfile (pandas 2.x, not 3.x), and
  # the offline submission notebook can't upgrade them. If our code ever relies on
  # something newer, this job fails here, before it fails at scoring time.
  # Update the pins whenever Kaggle updates its image.
  kaggle-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked --all-extras
      # --with layers these exact versions OVER the project environment, so these are
      # the ones the tests import.
      - run: >-
          uv run --with "pandas==2.3.3" --with "numpy==2.1.3" --with "scikit-learn==1.6.1"
          pytest -q

  # The model tests (LM features, encoder fine-tuning, encoder tuning, the LoRA'd LLM) need
  # torch, transformers and peft, which aren't package dependencies (ADR 0002): the jobs
  # above skip them. This job installs them so those tests RUN on every PR, on tiny random
  # models on CPU. (bitsandbytes' 4 bits need CUDA: the GPU notebooks exercise them.)
  torch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"   # Kaggle's version
      - run: uv sync --locked --all-extras
      # The CPU-only wheel (~200 MB). The default PyPI wheel bundles CUDA (~2.5 GB) that a
      # CI machine without a GPU would never use.
      - run: uv pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: uv pip install transformers peft
      # --no-sync: keep the packages installed above (a sync would remove them). If this
      # import works, the tests' importorskip can't skip.
      - run: uv run --no-sync python -c "import torch, transformers, peft"
      - run: >-
          uv run --no-sync pytest -q tests/test_lm.py tests/test_encoder.py tests/test_tune.py
          tests/test_champion.py tests/test_registry.py tests/test_llm.py

  # The live app's image (P4): it must build, carry Kaggle's torch and transformers (the
  # versions the champion was trained and checked with), import the app, and never contain
  # the competition data.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # A stand-in for the competition data, where a real checkout keeps it. The last step
      # fails if this file is found anywhere in the image.
      - run: mkdir -p data/raw && echo "not real data" > data/raw/SENTINEL_competition_data.csv
      - run: docker build -f app/Dockerfile -t ntl-app .
      - run: |
          versions=$(docker run --rm ntl-app python -c "import name_that_llm.serve, torch, transformers; print(torch.__version__, transformers.__version__)")
          echo "$versions"
          test "$versions" = "2.11.0+cpu 5.16.1"
      - run: >-
          docker run --rm ntl-app sh -c
          '! find / -name SENTINEL_competition_data.csv -print -quit 2>/dev/null | grep -q .'
