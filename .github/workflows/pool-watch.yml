# The weekly watch on the public pool (P8, spec §3 and §5.2).
#
# We train on a private pinned copy of the clean pool v10. The public pool changes upstream
# without notice (P7 lost 2 of its 5 sources between two runs), so every Wednesday this
# downloads the latest release's file and compares it with the pinned per-source counts.
# A pinned source that's gone fails the run, and a failed scheduled run emails the repo's
# owner: the signal to exclude it in configs/pool_all.yaml.
#
# It reads the source column only, never a passage, so nothing from the pool reaches the
# public logs.
name: pool-watch

on:
  schedule:
    - cron: "0 6 * * 3"  # Wednesdays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false  # the job never pushes
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Download the latest release's pool file
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        # The Kaggle CLI pinned as in retrain.yml; uvx keeps it out of the project's env.
        run: |
          uvx --from "kaggle==2.2.5" kaggle datasets download crtproduction/name-that-llm-open-pool \
            -f ntl_open_pool.parquet -p "$RUNNER_TEMP/pool" --unzip
      - name: Compare it with our pinned copy
        run: uv run python scripts/pool_release_check.py "$RUNNER_TEMP/pool/ntl_open_pool.parquet"
