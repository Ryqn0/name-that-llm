# The weekly export (P6): every Monday, the last 7 days of the demo's anonymous events are
# copied from Grafana Cloud (whose free tier keeps logs about two weeks) to the private
# DagsHub MLflow, experiment "live-feedback", with the week's live accuracy per model run
# (scripts/export_events.py). The events hold no text, and the job prints counts only.
name: weekly-export

on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays, 06:00 UTC
  workflow_dispatch:  # a manual "export now" button, in GitHub's Actions tab

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked --all-extras
      - run: uv run python scripts/export_events.py
        env:
          # Loki read access (Grafana Cloud). The token is a secret, masked in logs.
          GRAFANA_LOGS_URL: ${{ vars.GRAFANA_LOGS_URL }}
          GRAFANA_LOGS_USER: ${{ vars.GRAFANA_LOGS_USER }}  # an account number, not a secret
          GRAFANA_LOGS_TOKEN: ${{ secrets.GRAFANA_LOGS_TOKEN }}
          # The private DagsHub MLflow, as for the deploy.
          MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ vars.DAGSHUB_USER }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
