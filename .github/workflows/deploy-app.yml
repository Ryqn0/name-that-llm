# Continuous Deployment of the free demo (P4 revision, design §12): every merge to main that
# touches the demo redeploys its static Hugging Face Space, then checks the live site
# (scripts/deploy_space.py): it must serve exactly the uploaded files, and they must work.
name: deploy-app

on:
  push:
    branches: [main]
    paths:
      - "app/demo/**"  # the page, the engine, the model card, and MODEL_RUN (the model)
      - "scripts/deploy_space.py"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch:  # a manual "deploy now" button, in GitHub's Actions tab

# Two deploys at once would race to upload: the second one waits for the first.
concurrency:
  group: deploy-app
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Downloading the model, uploading it and waiting for the site take a few minutes; the
    # script itself gives up after 15.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra serve
      # The smoke test runs the engine with Node, which GitHub's Ubuntu machines come with.
      - run: uv run python scripts/deploy_space.py
        env:
          # Secrets: stored encrypted in GitHub, masked in logs.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          # Variables: not secret, but kept out of the code so they can change without a PR.
          HF_SPACE: ${{ vars.HF_SPACE }}
          MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ vars.DAGSHUB_USER }}
          # The monitoring collector's address (P6). Unset, it's empty: no telemetry.
          GRAFANA_COLLECTOR_URL: ${{ vars.GRAFANA_COLLECTOR_URL }}
